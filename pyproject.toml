[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "economic-analysis"
version = "0.1.0"
description = "Reproducible U.S. economic data pipeline for BLS, BEA, and SCF datasets."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1",
    "pandas>=2.2",
    "pyarrow>=15",
    "pydantic>=2",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "ruff>=0.8",
]

[project.scripts]
economic-analysis = "economic_analysis.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["economic_analysis", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["economic_analysis"]

[tool.mypy]
python_version = "3.11"
files = ["economic_analysis"]
ignore_missing_imports = true
warn_unused_configs = true
no_implicit_optional = true
check_untyped_defs = true
